name: Formatear código con Black

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Black
        run: pip install black

      - name: Ejecutar Black en el proyecto
        run: black .

      - name: Guardar cambios automáticamente en GitHub
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Formateo automático con Black"
          branch: main

